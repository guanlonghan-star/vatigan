<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片授权与制作说明</title><link rel="stylesheet" href="./css/app.css"></head><body><main><article class="node-view"><header class="node-heading"><p class="eyebrow">CREDITS</p><h1>图片授权与制作说明</h1><p>本页由构建工具根据 <code>image-credits.json</code> 生成。</p><p><a href="./index.html#route">返回导览</a></p></header><div id="credits" class="look-card">正在载入…</div></article></main><script type="module">const r=await fetch('./data/image-credits.json');const e=document.querySelector('#credits');if(r.ok){const d=await r.json();e.innerHTML=d.map(x=>`<section><h2>${x.node} · ${x.title}</h2><p>${x.attribution}</p><p><a href="${x.sourcePage}" rel="noreferrer">来源与授权</a></p></section>`).join('')}else e.textContent='图片授权记录尚未生成。';</script></body></html>
