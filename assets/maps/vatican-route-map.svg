<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1980" viewBox="0 0 760 1980">
  <title>梵蒂冈博物馆21站双层参观地图</title>
  <desc>原创路线示意图，标注V01至V21的讲解站点、展厅、楼层转换、入口和出口。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#641f2b"/></marker>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#35241f" flood-opacity=".28"/></filter>
    <style>
      .building{fill:#eee4d5;stroke:#bda988;stroke-width:2}.room{stroke:#a99370;stroke-width:1.25}.zone-pin{fill:#f4c8bd}.zone-pio{fill:#bcded2}.zone-transition{fill:#f2d697}.zone-sistine{fill:#d6c8ea}.zone-gallery-a{fill:#bed9e8}.zone-gallery-b{fill:#f6d0b5}.zone-gallery-c{fill:#efd58d}.zone-raphael{fill:#c8bce5}.courtyard{fill:#d8e8c8;stroke:#8ca66f;stroke-width:1.5;stroke-dasharray:4 3}
      .route{fill:none;stroke:#641f2b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);filter:url(#soft-shadow)}.return{fill:none;stroke:#9d5260;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 6;marker-end:url(#arrow)}.connector{fill:none;stroke:#c28b2c;stroke-width:4;stroke-dasharray:5 4}
      .station circle{stroke:#fffaf0;stroke-width:2;filter:url(#soft-shadow)}.station text{fill:#fffaf0;font:700 11px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.station.pin circle{fill:#c66b5f}.station.pio circle{fill:#3f8275}.station.gallery circle{fill:#bd8120}.station.raphael circle,.station.sistine circle{fill:#7657a4}.station.start circle{fill:#34734b}.station.end circle{fill:#a33131}
      .zone{fill:#27221f;font:700 12px Arial,"Microsoft YaHei",sans-serif;text-anchor:middle}.minor{fill:#756b62;font:10px Arial,"Microsoft YaHei",sans-serif;text-anchor:middle}.change{fill:#27221f;font:700 11px Arial,"Microsoft YaHei",sans-serif;text-anchor:middle}.station-name{fill:#27221f;stroke:#f5eddd;stroke-width:4px;stroke-linejoin:round;paint-order:stroke fill;font:700 11px Arial,"Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect width="760" height="1980" fill="#f5eddd"/>
  <text x="42" y="70" fill="#641f2b" font-family="Georgia,'Microsoft YaHei',serif" font-weight="700" font-size="34">梵蒂冈博物馆 · 21站参观地图</text>
  <text x="42" y="108" fill="#756b62" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">原创路线示意｜按楼层、展厅与地标定位｜不代表精确比例</text>

  <text x="42" y="160" fill="#27221f" font-family="Georgia,'Microsoft YaHei',serif" font-weight="700" font-size="26">一层</text>
  <text x="110" y="160" fill="#756b62" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">入口 · Pinacoteca · Pio Clementino · Sistine Chapel</text>
  <g transform="translate(55 180) scale(1.8)">
    <path class="building" d="M22 338H142V306H183V96H298V126H330V438H276V392H220V432H142V420H22Z"/>
    <rect class="room zone-pin" x="28" y="350" width="108" height="58" rx="3"/><line class="room" x1="64" y1="350" x2="64" y2="408"/><line class="room" x1="100" y1="350" x2="100" y2="408"/>
    <rect class="room zone-pio" x="190" y="104" width="100" height="126" rx="5"/><path class="courtyard" d="M213 128L267 128L282 150L269 192L217 202L198 174Z"/>
    <rect class="room zone-transition" x="190" y="244" width="96" height="47" rx="4"/><rect class="room zone-transition" x="294" y="138" width="28" height="150" rx="3"/><rect class="room zone-sistine" x="238" y="308" width="84" height="77" rx="4"/><rect class="room zone-sistine" x="282" y="398" width="40" height="30" rx="3"/><rect class="courtyard" x="145" y="318" width="71" height="84" rx="4"/>
    <text class="zone" x="82" y="323">Pinacoteca</text><text class="minor" x="82" y="427">绘画馆支线</text><text class="zone" x="240" y="90">Museo Pio Clementino</text><text class="minor" x="240" y="166">Octagonal Court</text>
    <text class="zone" x="238" y="262">Quattro Cancelli</text><text class="minor" x="238" y="279">返回入口主区域</text><text class="minor" x="180" y="362">Courtyard</text>
    <path class="route" d="M282 420 C250 424 201 421 144 385 C112 366 76 366 45 381"/><path class="return" d="M45 381 C82 326 149 320 190 273 C214 244 200 220 214 197"/><path class="route" d="M214 197 C204 160 222 122 254 122 C286 122 287 170 257 197 C238 214 215 220 204 247"/>
    <path class="connector" d="M204 247 C180 258 171 279 172 302"/><text class="change" x="139" y="283">上楼至二层 V09</text><path class="connector" d="M316 247 C328 266 324 286 306 303"/><text class="change" x="302" y="235">由二层 V14 下楼</text><path class="route" d="M306 303 C274 307 261 320 258 342 C256 365 272 379 296 384 C320 390 333 414 318 432"/>
    <g class="station start" transform="translate(282 420)"><circle r="16"/><text>01</text></g><g class="station pin" transform="translate(119 380)"><circle r="15"/><text>02</text></g><g class="station pin" transform="translate(82 380)"><circle r="15"/><text>03</text></g><g class="station pin" transform="translate(45 380)"><circle r="15"/><text>04</text></g>
    <g class="station pio" transform="translate(214 197)"><circle r="15"/><text>05</text></g><g class="station pio" transform="translate(214 152)"><circle r="15"/><text>06</text></g><g class="station pio" transform="translate(258 126)"><circle r="15"/><text>07</text></g><g class="station pio" transform="translate(258 196)"><circle r="15"/><text>08</text></g>
    <g class="station sistine" transform="translate(306 303)"><circle r="15"/><text>15</text></g><g class="station sistine" transform="translate(274 318)"><circle r="15"/><text>16</text></g><g class="station sistine" transform="translate(258 342)"><circle r="15"/><text>17</text></g><g class="station sistine" transform="translate(269 370)"><circle r="15"/><text>18</text></g><g class="station sistine" transform="translate(296 383)"><circle r="15"/><text>19</text></g><g class="station sistine" transform="translate(316 365)"><circle r="15"/><text>20</text></g><g class="station end" transform="translate(318 432)"><circle r="16"/><text>21</text></g>
    <text class="station-name" data-station-label="" data-station-id="01" x="260" y="438" text-anchor="end">路线序章</text><text class="station-name" data-station-label="" data-station-id="02" x="136" y="348" text-anchor="end">圣杰罗姆</text><text class="station-name" data-station-label="" data-station-id="03" x="82" y="416" text-anchor="middle">变容</text><text class="station-name" data-station-label="" data-station-id="04" x="58" y="348" text-anchor="end">基督下葬</text>
    <text class="station-name" data-station-label="" data-station-id="05" x="193" y="214" text-anchor="end">观景殿阿波罗</text><text class="station-name" data-station-label="" data-station-id="06" x="193" y="149" text-anchor="end">拉奥孔</text><text class="station-name" data-station-label="" data-station-id="07" x="258" y="103" text-anchor="middle">观景殿躯干</text><text class="station-name" data-station-label="" data-station-id="08" x="281" y="204">圆形大厅</text>
    <text class="station-name" data-station-label="" data-station-id="15" x="350" y="289" text-anchor="end">入堂准备</text><text class="station-name" data-station-label="" data-station-id="16" x="249" y="316" text-anchor="end">西斯廷天顶</text><text class="station-name" data-station-label="" data-station-id="17" x="235" y="344" text-anchor="end">创造亚当</text><text class="station-name" data-station-label="" data-station-id="18" x="244" y="376" text-anchor="end">先知与女先知</text><text class="station-name" data-station-label="" data-station-id="19" x="286" y="410" text-anchor="end">米开朗基罗</text><text class="station-name" data-station-label="" data-station-id="20" x="350" y="336" text-anchor="end">最后的审判</text><text class="station-name" data-station-label="" data-station-id="21" x="350" y="449" text-anchor="end">参观尾声</text>
  </g>

  <text x="42" y="1080" fill="#27221f" font-family="Georgia,'Microsoft YaHei',serif" font-weight="700" font-size="26">二层</text>
  <text x="110" y="1080" fill="#756b62" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">Galleries · Raphael Rooms</text>
  <g transform="translate(55 1095) scale(1.8)">
    <path class="building" d="M28 112H302V142H330V326H252V294H200V338H82V298H28Z"/>
    <rect class="room zone-gallery-a" x="36" y="130" width="54" height="156" rx="4"/><rect class="room zone-gallery-b" x="96" y="130" width="62" height="156" rx="4"/><rect class="room zone-gallery-c" x="164" y="130" width="92" height="156" rx="4"/><rect class="courtyard" x="72" y="166" width="154" height="82" rx="6"/>
    <rect class="room zone-raphael" x="264" y="150" width="56" height="134" rx="4"/><line class="room" x1="264" y1="183" x2="320" y2="183"/><line class="room" x1="264" y1="216" x2="320" y2="216"/><line class="room" x1="264" y1="249" x2="320" y2="249"/><rect class="room zone-transition" x="216" y="294" width="105" height="25" rx="3"/>
    <text class="minor" x="63" y="103">由一层 V08 上楼</text><text class="zone" x="63" y="318">烛台长廊</text><text class="minor" x="149" y="207">Pigna Courtyard</text><text class="zone" x="292" y="137">Raphael Rooms</text><text class="minor" x="268" y="345">下楼至一层 V15</text>
    <path class="connector" d="M63 91V129"/><path class="route" d="M63 151 C63 205 65 250 104 266 C143 282 190 272 226 258 C258 246 278 236 289 216 C300 196 306 172 292 160 C276 148 270 178 278 202 C286 226 304 253 286 276 C275 290 263 296 257 306"/><path class="connector" d="M257 306V354"/>
    <g class="station gallery" transform="translate(110 266)"><circle r="15"/><text>09</text></g><g class="station gallery" transform="translate(214 262)"><circle r="15"/><text>10</text></g><g class="station raphael" transform="translate(289 216)"><circle r="15"/><text>11</text></g><g class="station raphael" transform="translate(292 164)"><circle r="15"/><text>12</text></g><g class="station raphael" transform="translate(280 198)"><circle r="15"/><text>13</text></g><g class="station raphael" transform="translate(286 276)"><circle r="15"/><text>14</text></g>
    <text class="station-name" data-station-label="" data-station-id="09" x="110" y="304" text-anchor="middle">挂毯馆</text><text class="station-name" data-station-label="" data-station-id="10" x="214" y="304" text-anchor="middle">地图长廊</text><text class="station-name" data-station-label="" data-station-id="11" x="262" y="220" text-anchor="end">签字厅</text><text class="station-name" data-station-label="" data-station-id="12" x="264" y="154" text-anchor="end">雅典学院</text><text class="station-name" data-station-label="" data-station-id="13" x="253" y="192" text-anchor="end">圣体争辩</text><text class="station-name" data-station-label="" data-station-id="14" x="350" y="302" text-anchor="end">帕纳苏斯山</text>
  </g>

  <line x1="45" y1="1870" x2="105" y2="1870" stroke="#641f2b" stroke-width="8" stroke-linecap="round"/><text x="120" y="1877" fill="#27221f" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">主路线</text>
  <line x1="245" y1="1870" x2="305" y2="1870" stroke="#641f2b" stroke-width="5" stroke-dasharray="11 8"/><text x="320" y="1877" fill="#27221f" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">原路返回</text>
  <line x1="480" y1="1870" x2="540" y2="1870" stroke="#b48a44" stroke-width="6" stroke-dasharray="8 7"/><text x="555" y="1877" fill="#27221f" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">上下楼</text>
  <text x="42" y="1923" fill="#756b62" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">V01入口 · V02–04绘画馆 · V05–08古典雕塑 · V09–10长廊</text>
  <text x="42" y="1953" fill="#756b62" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">V11–14拉斐尔 · V15–20西斯廷 · V21出口与尾声</text>
</svg>

